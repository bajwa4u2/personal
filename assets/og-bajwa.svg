<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="M S Bajwa — Founder, operations executive, platform architect. Aura Platform LLC.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1326"/>
      <stop offset="100%" stop-color="#151B33"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0D9488" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </linearGradient>
    <style>
      .display { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; fill: #F5F7FB; }
      .literary { font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-weight: 400; fill: #F5F7FB; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #0D9488; letter-spacing: 0.08em; }
      .mist { fill: #A6AECC; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top eyebrow -->
  <text x="80" y="92" class="mono" font-size="14">FOUNDER · AURA PLATFORM LLC</text>

  <!-- Name -->
  <text x="80" y="200" class="display" font-size="92" letter-spacing="-1.5">M S Bajwa</text>

  <!-- Roles (serif italic) -->
  <text x="80" y="270" class="literary" font-size="34">Founder · Operations Executive · Platform Architect</text>

  <!-- Accent rule -->
  <rect x="80" y="320" width="480" height="2" fill="url(#rule)"/>

  <!-- Statement -->
  <text x="80" y="385" class="display" font-size="26" font-weight="400" fill="#F5F7FB" opacity="0.86">Building systems for communication,</text>
  <text x="80" y="425" class="display" font-size="26" font-weight="400" fill="#F5F7FB" opacity="0.86">accountability, continuity, and execution.</text>

  <!-- Bottom ecosystem strip -->
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#2A3458" stroke-width="1"/>
  <text x="80" y="565" class="mono" font-size="14">AURA</text>
  <text x="200" y="565" class="mono" font-size="14">ORCHESTRATE</text>
  <text x="400" y="565" class="mono" font-size="14">BAJWA WRITES</text>
  <text x="1120" y="565" class="mono" font-size="14" text-anchor="end">bajwa.auraplatform.org</text>
</svg>
